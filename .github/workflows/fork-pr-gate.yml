name: Fork PR Gate

# Runs CI for pull requests from forks only after a maintainer approves.
# Prevents untrusted code from running in the privileged workflow context.
on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  test:
    name: unit (fork-approved)
    if: github.event.label.name == 'safe-to-test' && github.event.pull_request.head.repo.fork == true
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  lint:
    name: golangci-lint (fork-approved)
    if: github.event.label.name == 'safe-to-test' && github.event.pull_request.head.repo.fork == true
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml
